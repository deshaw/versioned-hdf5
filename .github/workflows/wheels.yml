name: Build wheels

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: true
        type: string
permissions: {}

env:
  H5PY_VERSION: "3.16.0"

jobs:
  build-wheels:
    name: "Build wheel"
    runs-on: ${{ inputs.os }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # get the non-merge commit for PRs
          fetch-tags: true # include tags to get correct version from setuptools_scm
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Pin h5py version
        # h5py binary wheels ship hdf5 binaries. Updating h5py very frequently
        # breaks compatibility. The only reasonable way to support wheels is a
        # hard pin of the h5py version. Users can still use conda-forge packages
        # if they want more freedom.
        shell: bash
        run: |
          # Modifying any files checked in git will update the setuptools-scm version;
          # force setuptools-scm to return the previous version with a tag.
          pip install setuptools-scm
          TAG=$(python -m setuptools_scm)
          # No sed -i available on MacOS
          sed "s/h5py>=3.8.0/h5py==$H5PY_VERSION/" pyproject.toml > pyproject.toml.new
          mv pyproject.toml.new pyproject.toml
          git config --global user.email "bot@deshaw.com"
          git config --global user.name "Release bot"
          git commit -a -m 'Increase minimum h5py version'
          git tag -f "$TAG"

      # MacOS environment setup
      - name: Update env variables (MacOS)
        if: runner.os == 'macOS'
        run: |
          INCLUDE_PATH=$(python -c 'import sysconfig; print(sysconfig.get_path("include"))')
          # shellcheck disable=SC2086
          echo "CPATH=$INCLUDE_PATH:$CPATH" >> $GITHUB_ENV

      - name: Run cibw_before_all_macos
        if: runner.os == 'macOS'
        run: ci/cibw_before_all_macos.sh "${{ github.workspace }}"

      # Windows environment setup
      - name: choco install dependencies (Windows)
        # The chocolatey community feed (community.chocolatey.org) rate-limits CI traffic
        # which results in random failures; sometimes choco will even exit 0 with "installed 0/N"
        # resulting in crashes downstream regarding packages not found. See:
        #   https://docs.chocolatey.org/en-us/community-repository/community-packages-disclaimer/
        #   https://github.com/chocolatey/choco/issues/1564
        #   https://github.com/mandiant/flare-vm/issues/167
        # Retry the whole batch with backoff; already-installed packages are skipped.
        # pkg-config is deliberately NOT installed here - it is not available in the
        # image and a failed choco install used to be silent, surfacing only inside meson
        # as "Dependency lookup for hdf5 with method 'pkg-config' failed".
        # ci/cibw_before_all_windows.sh installs it from SourceForge instead.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgs = @('llvm', 'openssl')
          $max = 5
          foreach ($pkg in $pkgs) {
            for ($i = 1; $i -le $max; $i++) {
              Write-Host "::group::choco install attempt $i/$max for $pkg"
              choco install $pkg --yes --no-progress --allow-unofficial
              $code = $LASTEXITCODE
              Write-Host "::endgroup::"
              # 0 = success, 3010 = success but reboot required
              if ($code -eq 0 -or $code -eq 3010) { break }
              Write-Host "choco install $pkg failed (exit $code); retrying in 30s..."
              Start-Sleep -Seconds 30
            }
            # Already failing the job here would be premature: the runner image ships
            # both packages, so a flaky feed is not necessarily fatal. What matters is
            # that the toolchain is usable, which we verify below.
            if ($code -ne 0 -and $code -ne 3010) {
              Write-Warning "choco install $pkg failed after $max attempts"
            }
          }

          $missing = @()
          foreach ($tool in 'clang', 'clang++', 'llvm-ar') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host "$tool -> $($cmd.Source)"
            } else {
              $missing += $tool
            }
          }
          if ($missing) {
            Write-Error "Build tool(s) not found on PATH: $($missing -join ', ')"
            exit 1
          }

      - name: Run cibw_before_all_windows
        if: runner.os == 'Windows'
        shell: bash
        run: ci/cibw_before_all_windows.sh "${{ github.workspace }}"
        env:
          ARCH: ${{ inputs.arch }}

      # Build the wheels
      - name: Triage the build
        shell: bash
        run: ci/triage_build.sh "$ARCH" "${{ github.event.pull_request.head.sha || github.sha }}" "$PYTHONVERSION"
        env:
          ARCH: ${{ inputs.arch }}
          PYTHONVERSION: ${{ inputs.python-version }}

      - name: Run cibuildwheel
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          # Note that tool.cibuildwheel "skip" in pyproject.toml also limits what gets built
          # ci/triage_build.sh writes CIBW_BUILD, CIBW_BEFORE_BUILD and CIBW_BUILD_FRONTEND
          # into $GITHUB_ENV, where cibuildwheel picks them up automatically.
          CIBW_ARCHS: ${{ inputs.arch }}
          CIBW_SKIP: "*musllinux*"
          CIBW_BEFORE_BUILD_LINUX: yum install -y zlib-devel openssl-devel

      # Remove libhdf5 (and its deps libaec/libsz) embedded by auditwheel/delocate in
      # the repair step: at runtime these are provided by the installed h5py wheel,
      # which our extensions' RPATH points at (h5py.libs / h5py/.dylibs).
      # KEEP libcrypto: h5py does NOT ship it, so the wheel must remain self-contained
      # for OpenSSL (used by versioned_hdf5/hash.pyx). The repair tools vendor libcrypto
      # into the same shared directory; it merges harmlessly with h5py's own libs.
      - name: Remove embedded libhdf5 (Linux)
        if: runner.os == 'Linux'
        run: zip -d ./wheelhouse/*.whl 'h5py.libs/*' -x 'h5py.libs/libcrypto*'
      - name: Remove embedded libhdf5 (MacOS)
        if: runner.os == 'macOS'
        run: zip -d ./wheelhouse/*.whl 'h5py/*' -x 'h5py/.dylibs/libcrypto*'
      - name: Remove h5py DLLs from RECORD (Linux / MacOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cd wheelhouse
          unzip ./*.whl '*/RECORD'
          # Drop RECORD entries for the libs we deleted above, but keep libcrypto.
          # awk (not sed) for portability between GNU (Linux) and BSD (macOS).
          echo "Removing lines:"
          awk '/^h5py/ && !/libcrypto/' ./*/RECORD
          awk '!(/^h5py/ && !/libcrypto/)' ./*/RECORD > RECORD.new
          mv -v RECORD.new ./*/RECORD
          zip ./*.whl ./*/RECORD

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ inputs.os }}-${{inputs.arch}}-${{ inputs.python-version }}
          path: ./wheelhouse/*.whl

  # Start again from a clean environment.
  # pip install the wheel and run a subset of the unit tests.
  # DO NOT use the 'test' step in cibuildwheel, because it runs on a manylinux image
  # which includes libhdf5.
  smoke-test:
    name: "Smoke test"
    needs: [build-wheels]
    runs-on: ${{ inputs.os }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # get the non-merge commit for PRs
          fetch-tags: true # include tags to get correct version from setuptools_scm
          persist-credentials: false

      - name: Prevent accidentally testing repository package
        run: rm -r versioned_hdf5

      - name: Retrieve wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ inputs.os }}-${{inputs.arch}}-${{ inputs.python-version }}
          merge-multiple: true # Don't unzip into subdirectory
          path: wheels/

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies for smoke tests
        run: pip install pytest pytest-env hypothesis packaging psutil

      # Note: this pulls in the h5py wheel from pypi, which embeds libhdf5.
      - name: Install package for smoke tests
        shell: bash
        run: pip install -v ./wheels/*.whl

      - name: Test import h5py
        run: python -c 'import h5py; print(h5py.version.info)'

      - name: Test import versioned_hdf5
        run: python -c 'import versioned_hdf5; print(versioned_hdf5.__version__)'

      - name: Print hdf5 install path
        run: |
          python utils/debug_libhdf5_so.py h5py
          python utils/debug_libhdf5_so.py versioned_hdf5

      - name: Run smoke tests
        run: pytest -m 'api and not slow'

      - name: pip uninstall
        run: pip uninstall -y versioned-hdf5

      - name: Retest h5py after uninstalling versioned-hdf5
        run: python -c 'import h5py; print(h5py.version.info)'
