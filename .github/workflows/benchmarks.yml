name: Benchmarks
on:
  push:
    branches: [master]
  pull_request:
    branches: ["*"]
  workflow_dispatch: # allows you to trigger manually

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      matrix:
        env: ["mindeps", "bench"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # get correct version from setuptools_scm
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a2789fe3805b9ae22d6c25a15df2f2c624cd092e # v0.11.1
        with:
          pixi-version: v0.82.0
          cache: true
          environments: ${{ matrix.env }}

      - name: Compile, install, and print versions
        run: pixi r -e ${{ matrix.env }} smoke

      - name: Setup asv
        run: |
          # Work around https://github.com/airspeed-velocity/asv/issues/1508
          sed -i "s/master/$(git rev-parse --abbrev-ref HEAD)/" asv.conf.json
          pixi r -e ${{ matrix.env }} asv-machine

      - name: Run Benchmarks
        run: pixi r -e ${{ matrix.env }} asv-run

      - name: Upload asv results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asv-results-${{ matrix.env }}
          path: .asv/results

      - name: Smoke test asv-compare
        run: |
          pixi r -e ${{ matrix.env }} asv-compare -n 2 -b time_hash_slab \
            v2.4.0 HEAD
