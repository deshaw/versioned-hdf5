name: Release Python Bindings to PyPI

permissions: {}

on:
  release:
    types: [published]
  pull_request: # Binary wheels are only built for PRs with the 'wheels' label
  workflow_dispatch:
    inputs:
      test_pypi:
        type: boolean
        description: "Test release: publish on test.pypi.org"
        default: false

# When this workflow is queued, automatically cancel any previous running
# or pending jobs from the same branch
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: 💻 Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # get correct version from setuptools_scm
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a2789fe3805b9ae22d6c25a15df2f2c624cd092e # v0.11.1
        with:
          pixi-version: v0.82.0
          cache: true
          environments: py314

      - name: 📦 Build the source tarball
        run: pixi r -e py314 sdist

      - name: Check source package
        run: pixi r -e py314 twine-check

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: ./dist/*.tar.gz

  build-wheels:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'wheels')
    name: "Build wheels: ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.python-version }}"
    uses: ./.github/workflows/wheels.yml
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-2022
        # FIXME 3.15 depends on a pypi binary release of h5py
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
          - os: windows-2022
            arch: AMD64

  publish:
    name: Publish Python packages on PyPI
    if: (github.event_name == 'release' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'workflow_dispatch')
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/versioned-hdf5
    permissions:
      id-token: write
    steps:
      - name: Retrieve wheels and sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: wheels/

      - name: print artifacts
        run: ls -l wheels/

      - name: 🧪 Publish to PyPI Testing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: ${{ inputs.test_pypi }}
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: wheels

      - name: 🎉 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: ${{ !inputs.test_pypi }}
        with:
          packages-dir: wheels
